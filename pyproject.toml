[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-gym"
version = "2.0.0"
description = "A benchmark for simulated time budgets and forecasts"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.24,<3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]

[tool.setuptools]
packages = ["time_gym"]
